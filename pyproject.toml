[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-backtest"
version = "0.2.0"
description = "Event-driven backtesting engine for the trade-suite: signals, simulated execution, portfolio accounting, performance metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trade-suite" }]
keywords = ["trading", "backtesting", "backtest", "quant", "finance", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crieck2010/trade-backtest"
Repository = "https://github.com/crieck2010/trade-backtest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
